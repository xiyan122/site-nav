<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站点导航 · pengyuyan29</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="pengyuyan29 的站点索引：GitHub Pages、自建站与收藏夹，每日自动同步">
<script>
  /* 首屏防闪烁：在渲染前确定主题 */
  (function () {
    var t = localStorage.getItem('nav-theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #0b0f17;
    --bg-glow: #14243f;
    --card: #121a2a;
    --card-hover: #182238;
    --border: #1e2a42;
    --border-strong: #2c3d63;
    --text: #e6edf6;
    --dim: #8b98ad;
    --accent: #6ea8fe;
    --accent-soft: rgba(110,168,254,.12);
    --accent-hover: rgba(110,168,254,.25);
    --green: #3fb96f;
    --gray: #55637a;
    --mask: rgba(4,8,16,.66);
    --bg-blur: rgba(11,15,23,.85);
    --chip-bg: rgba(110,168,254,.12);
    --chip-dim-bg: rgba(139,152,173,.1);
    --input-bg: #0b0f17;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --bg-glow: #dbe7fb;
    --card: #ffffff;
    --card-hover: #f2f6ff;
    --border: #e2e8f2;
    --border-strong: #b9cdf0;
    --text: #1a2233;
    --dim: #5b6779;
    --accent: #2f6fe0;
    --accent-soft: rgba(47,111,224,.09);
    --accent-hover: rgba(47,111,224,.18);
    --green: #1f9d55;
    --gray: #9aa6b8;
    --mask: rgba(30,40,60,.35);
    --bg-blur: rgba(244,246,251,.85);
    --chip-bg: rgba(47,111,224,.1);
    --chip-dim-bg: rgba(91,103,121,.09);
    --input-bg: #ffffff;
    --shadow: 0 10px 30px rgba(30,50,90,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, var(--bg-glow) 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 20px 60px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; flex: none; }
  header h1 {
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), #a6f0e2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    display: inline-block;
  }
  header .sub { color: var(--dim); margin-top: 8px; font-size: 14px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .topbar {
    position: sticky; top: 0; z-index: 40;
    margin: 24px -20px 0; padding: 12px 20px 0;
    background: var(--bg-blur);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  #tabs { display: flex; gap: 8px; margin: 14px 0 12px; flex-wrap: wrap; }
  .tab {
    padding: 7px 15px; border-radius: 99px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); background: transparent; color: var(--dim);
    transition: all .15s;
  }
  .tab:hover { color: var(--text); border-color: var(--border-strong); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tab .n { opacity: .72; font-size: 11px; margin-left: 4px; }
  #stats { color: var(--dim); font-size: 13px; }

  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px; margin-top: 24px;
  }
  #search {
    flex: 1; min-width: 220px; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 14px; outline: none; transition: border-color .2s;
  }
  #search:focus { border-color: var(--accent); }
  #addBtn, #themeBtn {
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; white-space: nowrap;
    transition: background .18s, border-color .18s;
  }
  #addBtn {
    border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  }
  #addBtn:hover { background: var(--accent-hover); }
  #themeBtn { border: 1px solid var(--border); background: var(--card); color: var(--dim); }
  #themeBtn:hover { border-color: var(--accent); color: var(--accent); }
  #stats { color: var(--dim); font-size: 13px; }

  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; transition: transform .18s, background .18s, border-color .18s, box-shadow .18s;
  }
  .card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--border-strong); box-shadow: var(--shadow); }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .card h3 { font-size: 16px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--gray); }
  .dot.custom { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .card p { color: var(--dim); font-size: 13px; line-height: 1.6; margin-top: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 41px; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: var(--chip-bg); color: var(--accent); white-space: nowrap;
  }
  .chip.dim { background: var(--chip-dim-bg); color: var(--dim); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
  .meta time { color: var(--gray); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
  footer { text-align: center; color: var(--gray); font-size: 12px; margin-top: 48px; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="站点导航">
      <div>
        <h1>站点导航</h1>
        <p class="sub">pengyuyan29 的站点索引 · Pages 每日自动同步 + 自定义管理</p>
      </div>
    </div>
    <div class="topbar">
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索站点名称或描述…" autocomplete="off">
        <button id="addBtn" type="button" title="进入管理后台：添加/删除站点、管理扫描账号">⚙ 管理</button>
        <button id="themeBtn" type="button" title="切换浅色 / 深色">浅色</button>
        <span id="stats"></span>
      </div>
      <nav id="tabs"></nav>
    </div>
  </header>
  <main id="grid"><p class="empty">加载中…</p></main>

  <footer>
    数据由 Cloudflare Worker 每日自动扫描 ·
    <a href="https://github.com/pengyuyan29" target="_blank" rel="noopener">GitHub @pengyuyan29</a>
  </footer>
</div>
<script>
  const grid = document.getElementById('grid');
  const searchEl = document.getElementById('search');
  const statsEl = document.getElementById('stats');
  let SITES = [];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function relTime(iso) {
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d >= 365) return Math.floor(d / 365) + ' 年前';
    if (d >= 30) return Math.floor(d / 30) + ' 个月前';
    if (d >= 1) return d + ' 天前';
    if (h >= 1) return h + ' 小时前';
    if (m >= 1) return m + ' 分钟前';
    return '刚刚';
  }

  function card(s) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener';
    const isCustom = s.status === 'custom';
    const cat = s.cat === 'self' ? 'self' : 'collect';
    const lang = isCustom
      ? `<span class="chip">${cat === 'self' ? '自建' : '收藏'}</span>`
      : (s.language ? `<span class="chip">${esc(s.language)}</span>` : '');
    const src = isCustom ? '' : `<span class="chip dim">@${esc(ownerOf(s))}</span>`;
    const dotCls = isCustom ? 'custom' : (s.status === 'online' ? 'on' : 'off');
    const dotTitle = isCustom ? '自定义链接' : (s.status === 'online' ? '在线' : '离线');
    const time = isCustom ? '' : '更新于 ' + relTime(s.pushed_at);
    const topics = (s.topics || []).slice(0, 3)
      .map(t => `<span class="chip dim">${esc(t)}</span>`).join('');
    a.innerHTML = `
      <div class="row">
        <span class="dot ${dotCls}" title="${dotTitle}"></span>
        <h3>${esc(s.repo)}</h3>${lang}${src}
      </div>
      <p>${esc(s.description || '暂无描述')}</p>
      <div class="meta">
        <time>${time}</time>
        <div class="chips">${topics}</div>
      </div>`;
    return a;
  }

  function render(list) {
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<p class="empty">没有匹配的站点</p>';
      return;
    }
    list.forEach(s => grid.appendChild(card(s)));
  }

  // ===== 分类标签页（来源 = GitHub 用户名，动态生成） =====
  const tabsEl = document.getElementById('tabs');
  let activeCat = localStorage.getItem('nav-cat') || 'all';

  const ownerOf = s => s.owner || 'pengyuyan29';   // 兼容旧数据
  const catOf = s => s.status === 'custom'
    ? (s.cat === 'self' ? '自建站' : '收藏夹')
    : 'u:' + ownerOf(s).toLowerCase();

  function cats() {
    const list = [['all', '全部']];
    const seen = new Set();
    SITES.filter(s => s.status !== 'custom').forEach(s => {
      const k = catOf(s);
      if (!seen.has(k)) { seen.add(k); list.push([k, ownerOf(s)]); }
    });
    list.push(['自建站', '自建站'], ['收藏夹', '收藏夹']);
    if (!list.some(c => c[0] === activeCat)) activeCat = 'all';
    return list;
  }

  function buildTabs() {
    tabsEl.innerHTML = '';
    cats().forEach(([k, label]) => {
      const n = k === 'all' ? SITES.length : SITES.filter(s => catOf(s) === k).length;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (activeCat === k ? ' active' : '');
      b.innerHTML = `${label}<span class="n">${n}</span>`;
      b.addEventListener('click', () => {
        activeCat = k;
        localStorage.setItem('nav-cat', k);
        buildTabs();
        render(currentList());
      });
      tabsEl.appendChild(b);
    });
  }

  function currentList() {
    const q = searchEl.value.trim().toLowerCase();
    return SITES.filter(s =>
      (activeCat === 'all' || catOf(s) === activeCat) &&
      (!q || s.repo.toLowerCase().includes(q) ||
        (s.description || '').toLowerCase().includes(q) ||
        (s.topics || []).some(t => t.toLowerCase().includes(q))));
  }

  searchEl.addEventListener('input', () => render(currentList()));

  async function load() {
    try {
      const r1 = await fetch('/api/sites?t=' + Date.now());
      const d = await r1.json();
      const list = (d.sites || []).sort((a, b) => (b.pushed_at || '').localeCompare(a.pushed_at || ''));
      list.sort((a, b) => (a.status === 'custom' ? 0 : 1) - (b.status === 'custom' ? 0 : 1));
      SITES = list;
      const nPages = SITES.filter(s => s.status !== 'custom').length;
      const nCustom = SITES.length - nPages;
      const t = d.updated_at ? d.updated_at.replace(' UTC', '') + ' UTC' : '—';
      statsEl.textContent = `${nPages} 个站点 · ${nCustom} 个收藏/自建 · 扫描于 ${t}`;
      buildTabs();
      render(currentList());
    } catch (e) {
      grid.innerHTML = '<p class="empty">数据加载失败，请稍后刷新</p>';
    }
  }
  load();

  // ===== 主题切换 =====
  const themeBtn = document.getElementById('themeBtn');
  function applyThemeBtn() {
    themeBtn.textContent = document.documentElement.dataset.theme === 'light' ? '深色' : '浅色';
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('nav-theme', next);
    applyThemeBtn();
  });
  applyThemeBtn();

  // ===== 管理入口 =====
  document.getElementById('addBtn').addEventListener('click', () => {
    window.location.href = '/admin';
  });
</script>
</body>
</html>
